[workspace]
members = [
    "cmd/gateway-bench",
    "cmd/gateway-main",
    "crates/gateway-admin",
    "crates/gateway-config",
    "crates/gateway-filters",
    "crates/gateway-observability",
    "crates/gateway-proxy",
    "crates/gateway-router",
    "crates/gateway-runtime",
    "crates/gateway-types",
    "crates/gateway-upstream",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.9.8"
