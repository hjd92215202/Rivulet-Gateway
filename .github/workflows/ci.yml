name: ci

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always
  GATEWAY_DISABLE_ACCESS_LOG: "1"

jobs:
  script-standards:
    name: Script Standards
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check repository shell scripts
        run: bash ./scripts/check-script-standards.sh

      - name: Validate public API gate schema
        run: bash ./scripts/linux-public-api-gate.sh --mode schema-check --profile standard

  test-linux:
    name: Test Linux x86_64
    runs-on: ubuntu-24.04
    needs:
      - script-standards
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Workspace tests
        run: cargo test --workspace

  test-windows:
    name: Test Windows x86_64
    runs-on: windows-2022
    needs:
      - script-standards
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        shell: powershell
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable

      - name: Format check
        shell: powershell
        run: cargo fmt --all -- --check

      - name: Workspace tests
        shell: powershell
        run: cargo test --workspace

  test-linux-arm64:
    name: Test Linux arm64
    runs-on: ubuntu-24.04-arm
    needs:
      - script-standards
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Workspace tests
        run: cargo test --workspace

  package-linux-x86_64:
    name: Package Linux x86_64
    runs-on: ubuntu-24.04
    needs:
      - test-linux
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve workspace version
        id: version
        run: echo "value=$(bash ./scripts/get-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install rpm toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm cpio

      - name: Build release binary
        run: cargo build -p gateway-main --release --target x86_64-unknown-linux-gnu

      - name: Stage package root
        run: bash ./scripts/package.sh --target x86_64-unknown-linux-gnu --format dir --skip-build

      - name: Run Linux smoke suite
        run: bash ./packaging/tests/server-smoke.sh ./dist/x86_64-unknown-linux-gnu/rivulet-gateway-${{ steps.version.outputs.value }}/usr/bin/gateway

      - name: Build tarball
        run: bash ./scripts/package.sh --target x86_64-unknown-linux-gnu --format tar.gz --skip-build

      - name: Validate tarball layout
        run: bash ./packaging/tests/validate-package.sh ./dist/x86_64-unknown-linux-gnu/rivulet-gateway-${{ steps.version.outputs.value }}.tar.gz

      - name: Smoke test installed tarball layout
        run: PORT=18084 bash ./packaging/tests/install-package.sh ./dist/x86_64-unknown-linux-gnu/rivulet-gateway-${{ steps.version.outputs.value }}.tar.gz

      - name: Build rpm
        run: bash ./scripts/package.sh --target x86_64-unknown-linux-gnu --format rpm --skip-build

      - name: Validate rpm layout
        run: bash ./packaging/tests/validate-package.sh "$(find ./dist/rpmbuild/x86_64-unknown-linux-gnu/RPMS -name '*.rpm' | head -n 1)"

      - name: Smoke test installed rpm layout
        run: PORT=18085 bash ./packaging/tests/install-package.sh "$(find ./dist/rpmbuild/x86_64-unknown-linux-gnu/RPMS -name '*.rpm' | head -n 1)"

      - name: Publish Linux artifacts
        uses: actions/upload-artifact@v6
        with:
          name: rivulet-linux-x86_64
          path: |
            dist/x86_64-unknown-linux-gnu/*.tar.gz
            dist/rpmbuild/x86_64-unknown-linux-gnu/RPMS/**/*.rpm
          if-no-files-found: error

  package-windows-x86_64:
    name: Package Windows x86_64
    runs-on: windows-2022
    needs:
      - test-windows
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve workspace version
        id: version
        shell: powershell
        run: |
          $value = .\scripts\get-version.ps1
          "value=$value" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Install Rust toolchain
        shell: powershell
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Build release binary
        shell: powershell
        run: cargo build -p gateway-main --release --target x86_64-pc-windows-msvc

      - name: Stage package root
        shell: powershell
        run: .\scripts\package.ps1 -Target x86_64-pc-windows-msvc -Format dir -SkipBuild

      - name: Run Windows smoke suite
        shell: powershell
        run: .\packaging\tests\server-smoke.ps1 -Binary .\dist\x86_64-pc-windows-msvc\rivulet-gateway-${{ steps.version.outputs.value }}\gateway.exe -Port 18081

      - name: Build zip
        shell: powershell
        run: .\scripts\package.ps1 -Target x86_64-pc-windows-msvc -Format zip -SkipBuild

      - name: Publish Windows artifacts
        uses: actions/upload-artifact@v6
        with:
          name: rivulet-windows-x86_64
          path: dist/x86_64-pc-windows-msvc/*.zip
          if-no-files-found: error

  package-linux-arm64:
    name: Package Linux arm64
    runs-on: ubuntu-24.04-arm
    needs:
      - test-linux-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve workspace version
        id: version
        run: echo "value=$(bash ./scripts/get-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install rpm toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm cpio

      - name: Build release binary
        run: cargo build -p gateway-main --release --target aarch64-unknown-linux-gnu

      - name: Stage package root
        run: bash ./scripts/package.sh --target aarch64-unknown-linux-gnu --format dir --skip-build

      - name: Run Linux arm64 smoke suite
        run: bash ./packaging/tests/server-smoke.sh ./dist/aarch64-unknown-linux-gnu/rivulet-gateway-${{ steps.version.outputs.value }}/usr/bin/gateway

      - name: Build tarball
        run: bash ./scripts/package.sh --target aarch64-unknown-linux-gnu --format tar.gz --skip-build

      - name: Validate tarball layout
        run: bash ./packaging/tests/validate-package.sh ./dist/aarch64-unknown-linux-gnu/rivulet-gateway-${{ steps.version.outputs.value }}.tar.gz

      - name: Smoke test installed tarball layout
        run: PORT=18084 bash ./packaging/tests/install-package.sh ./dist/aarch64-unknown-linux-gnu/rivulet-gateway-${{ steps.version.outputs.value }}.tar.gz

      - name: Build rpm
        run: bash ./scripts/package.sh --target aarch64-unknown-linux-gnu --format rpm --skip-build

      - name: Validate rpm layout
        run: bash ./packaging/tests/validate-package.sh "$(find ./dist/rpmbuild/aarch64-unknown-linux-gnu/RPMS -name '*.rpm' | head -n 1)"

      - name: Smoke test installed rpm layout
        run: PORT=18085 bash ./packaging/tests/install-package.sh "$(find ./dist/rpmbuild/aarch64-unknown-linux-gnu/RPMS -name '*.rpm' | head -n 1)"

      - name: Publish Linux arm64 artifacts
        uses: actions/upload-artifact@v6
        with:
          name: rivulet-linux-arm64
          path: |
            dist/aarch64-unknown-linux-gnu/*.tar.gz
            dist/rpmbuild/aarch64-unknown-linux-gnu/RPMS/**/*.rpm
          if-no-files-found: error

  systemd-lifecycle-linux-x86_64:
    name: Systemd Lifecycle Linux x86_64
    runs-on: ubuntu-24.04
    needs:
      - package-linux-x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download Linux x86_64 artifacts
        uses: actions/download-artifact@v5
        with:
          name: rivulet-linux-x86_64
          path: ci-systemd-assets/x86_64

      - name: Resolve Linux x86_64 package artifacts
        id: artifacts
        run: |
          tarball="$(find ci-systemd-assets/x86_64 -type f -name '*.tar.gz' | head -n 1)"
          rpm_package="$(find ci-systemd-assets/x86_64 -type f -name '*.rpm' | head -n 1)"

          if [[ -z "$tarball" || -z "$rpm_package" ]]; then
            echo "failed to resolve tar.gz or rpm artifact" >&2
            exit 1
          fi

          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "rpm_package=$rpm_package" >> "$GITHUB_OUTPUT"

      - name: Validate systemd lifecycle (tar.gz)
        run: |
          bash ./scripts/linux-systemd-validate.sh \
            --artifact "${{ steps.artifacts.outputs.tarball }}" \
            --format tar.gz \
            --host localhost \
            --gateway-port 18184 \
            --backend-port 19184 \
            --label ci-systemd-x86-tar \
            --work-dir "$RUNNER_TEMP/rivulet-ci-systemd-x86-tar"

      - name: Validate systemd lifecycle (rpm)
        run: |
          bash ./scripts/linux-systemd-validate.sh \
            --artifact "${{ steps.artifacts.outputs.rpm_package }}" \
            --format rpm \
            --host localhost \
            --gateway-port 18185 \
            --backend-port 19185 \
            --label ci-systemd-x86-rpm \
            --work-dir "$RUNNER_TEMP/rivulet-ci-systemd-x86-rpm"

      - name: Upload Linux x86_64 systemd lifecycle reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rivulet-ci-systemd-linux-x86_64
          path: |
            ${{ runner.temp }}/rivulet-ci-systemd-x86-tar
            ${{ runner.temp }}/rivulet-ci-systemd-x86-rpm
          if-no-files-found: ignore

  systemd-lifecycle-linux-arm64:
    name: Systemd Lifecycle Linux arm64
    runs-on: ubuntu-24.04-arm
    needs:
      - package-linux-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download Linux arm64 artifacts
        uses: actions/download-artifact@v5
        with:
          name: rivulet-linux-arm64
          path: ci-systemd-assets/arm64

      - name: Resolve Linux arm64 package artifacts
        id: artifacts
        run: |
          tarball="$(find ci-systemd-assets/arm64 -type f -name '*.tar.gz' | head -n 1)"
          rpm_package="$(find ci-systemd-assets/arm64 -type f -name '*.rpm' | head -n 1)"

          if [[ -z "$tarball" || -z "$rpm_package" ]]; then
            echo "failed to resolve tar.gz or rpm artifact" >&2
            exit 1
          fi

          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "rpm_package=$rpm_package" >> "$GITHUB_OUTPUT"

      - name: Validate systemd lifecycle (tar.gz)
        run: |
          bash ./scripts/linux-systemd-validate.sh \
            --artifact "${{ steps.artifacts.outputs.tarball }}" \
            --format tar.gz \
            --host localhost \
            --gateway-port 18284 \
            --backend-port 19284 \
            --label ci-systemd-arm-tar \
            --work-dir "$RUNNER_TEMP/rivulet-ci-systemd-arm-tar"

      - name: Validate systemd lifecycle (rpm)
        run: |
          bash ./scripts/linux-systemd-validate.sh \
            --artifact "${{ steps.artifacts.outputs.rpm_package }}" \
            --format rpm \
            --host localhost \
            --gateway-port 18285 \
            --backend-port 19285 \
            --label ci-systemd-arm-rpm \
            --work-dir "$RUNNER_TEMP/rivulet-ci-systemd-arm-rpm"

      - name: Upload Linux arm64 systemd lifecycle reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rivulet-ci-systemd-linux-arm64
          path: |
            ${{ runner.temp }}/rivulet-ci-systemd-arm-tar
            ${{ runner.temp }}/rivulet-ci-systemd-arm-rpm
          if-no-files-found: ignore

  public-api-gate-linux-x86_64:
    name: Public API Gate Linux x86_64
    runs-on: ubuntu-24.04
    needs:
      - package-linux-x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download Linux x86_64 artifacts
        uses: actions/download-artifact@v5
        with:
          name: rivulet-linux-x86_64
          path: ci-public-api-assets/x86_64

      - name: Resolve Linux x86_64 tarball
        id: artifacts
        run: |
          tarball="$(find ci-public-api-assets/x86_64 -type f -name '*.tar.gz' | head -n 1)"
          if [[ -z "$tarball" ]]; then
            echo "failed to resolve Linux x86_64 tarball artifact" >&2
            exit 1
          fi
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Run public API gate (evaluate)
        run: |
          bash ./scripts/linux-public-api-gate.sh \
            --mode evaluate \
            --profile standard \
            --artifact "${{ steps.artifacts.outputs.tarball }}" \
            --format tar.gz \
            --gateway-port 18584 \
            --backend-port 19584 \
            --output-dir "$RUNNER_TEMP/rivulet-ci-public-api-gate-x86"

      - name: Upload Linux x86_64 public API gate report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rivulet-ci-public-api-gate-linux-x86_64
          path: ${{ runner.temp }}/rivulet-ci-public-api-gate-x86
          if-no-files-found: ignore

  public-api-gate-linux-arm64:
    name: Public API Gate Linux arm64
    runs-on: ubuntu-24.04-arm
    needs:
      - package-linux-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download Linux arm64 artifacts
        uses: actions/download-artifact@v5
        with:
          name: rivulet-linux-arm64
          path: ci-public-api-assets/arm64

      - name: Resolve Linux arm64 tarball
        id: artifacts
        run: |
          tarball="$(find ci-public-api-assets/arm64 -type f -name '*.tar.gz' | head -n 1)"
          if [[ -z "$tarball" ]]; then
            echo "failed to resolve Linux arm64 tarball artifact" >&2
            exit 1
          fi
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Run public API gate (evaluate)
        run: |
          bash ./scripts/linux-public-api-gate.sh \
            --mode evaluate \
            --profile standard \
            --artifact "${{ steps.artifacts.outputs.tarball }}" \
            --format tar.gz \
            --gateway-port 18684 \
            --backend-port 19684 \
            --output-dir "$RUNNER_TEMP/rivulet-ci-public-api-gate-arm"

      - name: Upload Linux arm64 public API gate report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rivulet-ci-public-api-gate-linux-arm64
          path: ${{ runner.temp }}/rivulet-ci-public-api-gate-arm
          if-no-files-found: ignore

  supply-chain:
    name: Supply Chain Checks
    runs-on: ubuntu-24.04
    needs:
      - package-linux-x86_64
      - package-windows-x86_64
      - package-linux-arm64
      - systemd-lifecycle-linux-x86_64
      - systemd-lifecycle-linux-arm64
      - public-api-gate-linux-x86_64
      - public-api-gate-linux-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download packaged artifacts
        uses: actions/download-artifact@v5
        with:
          path: ci-assets

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ci-assets
          format: spdx-json
          output-file: ci-assets/SBOM.spdx.json

      - name: Build SHA256 manifest
        run: |
          (
            cd ci-assets
            find . -type f -printf '%P\0' | sort -z | xargs -0 sha256sum > ../CI-SHA256SUMS.txt
          )

      - name: Verify checksums
        run: bash ./packaging/tests/verify-checksums.sh ./CI-SHA256SUMS.txt ./ci-assets

      - name: Attest build provenance
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            ci-assets/**/*
            CI-SHA256SUMS.txt

      - name: Upload supply-chain report
        uses: actions/upload-artifact@v6
        with:
          name: rivulet-supply-chain
          path: |
            ci-assets/SBOM.spdx.json
            CI-SHA256SUMS.txt
          if-no-files-found: error
