name: nightly-benchmark

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      sampling_label:
        description: "Sampling label for M2 closure sprint (e.g. manual-am-1030/manual-pm-2030)"
        required: false
        default: "manual"
      sampling_slot:
        description: "Sampling slot marker for operational traceability"
        required: false
        type: choice
        options:
          - manual
          - am-1030
          - pm-2030
        default: manual

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always
  GATEWAY_DISABLE_ACCESS_LOG: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  benchmark-linux-x86_64:
    name: Benchmark Linux x86_64
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Run conservative benchmark baseline
        run: bash ./scripts/bench-baseline.sh

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v6
        with:
          name: rivulet-benchmark-linux-x86_64
          path: target/bench/*.csv
          if-no-files-found: error

  package-linux-x86_64:
    name: Nightly Package Linux x86_64
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Build release binary
        run: cargo build -p gateway-main --release --target x86_64-unknown-linux-gnu

      - name: Build Linux tarball
        run: bash ./scripts/package.sh --target x86_64-unknown-linux-gnu --format tar.gz --skip-build

      - name: Upload Linux x86_64 nightly package
        uses: actions/upload-artifact@v6
        with:
          name: rivulet-nightly-linux-x86_64
          path: dist/x86_64-unknown-linux-gnu/*.tar.gz
          if-no-files-found: error

  package-linux-arm64:
    name: Nightly Package Linux arm64
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Build release binary
        run: cargo build -p gateway-main --release --target aarch64-unknown-linux-gnu

      - name: Build Linux arm64 tarball
        run: bash ./scripts/package.sh --target aarch64-unknown-linux-gnu --format tar.gz --skip-build

      - name: Upload Linux arm64 nightly package
        uses: actions/upload-artifact@v6
        with:
          name: rivulet-nightly-linux-arm64
          path: dist/aarch64-unknown-linux-gnu/*.tar.gz
          if-no-files-found: error

  public-api-observe-linux-x86_64:
    name: Nightly Public API Observe Linux x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs:
      - package-linux-x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download Linux x86_64 nightly package
        uses: actions/download-artifact@v6
        with:
          name: rivulet-nightly-linux-x86_64
          path: nightly-public-api-assets/x86_64

      - name: Resolve Linux x86_64 nightly tarball
        id: artifacts
        run: |
          tarball="$(find nightly-public-api-assets/x86_64 -type f -name '*.tar.gz' | head -n 1)"
          if [[ -z "$tarball" ]]; then
            echo "failed to resolve Linux x86_64 nightly tarball" >&2
            exit 1
          fi
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Run nightly public API observe gate
        run: |
          bash ./scripts/linux-public-api-gate.sh \
            --mode evaluate \
            --profile observe \
            --arch linux-x86_64 \
            --artifact "${{ steps.artifacts.outputs.tarball }}" \
            --format tar.gz \
            --gateway-port 19184 \
            --backend-port 20184 \
            --output-dir "$RUNNER_TEMP/rivulet-nightly-public-api-observe-x86"

      - name: Upload Linux x86_64 observe report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rivulet-nightly-public-api-observe-linux-x86_64
          path: ${{ runner.temp }}/rivulet-nightly-public-api-observe-x86
          if-no-files-found: ignore

  public-api-observe-linux-arm64:
    name: Nightly Public API Observe Linux arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    needs:
      - package-linux-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download Linux arm64 nightly package
        uses: actions/download-artifact@v6
        with:
          name: rivulet-nightly-linux-arm64
          path: nightly-public-api-assets/arm64

      - name: Resolve Linux arm64 nightly tarball
        id: artifacts
        run: |
          tarball="$(find nightly-public-api-assets/arm64 -type f -name '*.tar.gz' | head -n 1)"
          if [[ -z "$tarball" ]]; then
            echo "failed to resolve Linux arm64 nightly tarball" >&2
            exit 1
          fi
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Run nightly public API observe gate
        run: |
          bash ./scripts/linux-public-api-gate.sh \
            --mode evaluate \
            --profile observe \
            --arch linux-arm64 \
            --artifact "${{ steps.artifacts.outputs.tarball }}" \
            --format tar.gz \
            --gateway-port 19284 \
            --backend-port 20284 \
            --output-dir "$RUNNER_TEMP/rivulet-nightly-public-api-observe-arm"

      - name: Upload Linux arm64 observe report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rivulet-nightly-public-api-observe-linux-arm64
          path: ${{ runner.temp }}/rivulet-nightly-public-api-observe-arm
          if-no-files-found: ignore

  public-api-calibration-summary:
    name: Nightly Public API Calibration Summary
    runs-on: ubuntu-24.04
    needs:
      - public-api-observe-linux-x86_64
      - public-api-observe-linux-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download observe reports
        uses: actions/download-artifact@v6
        with:
          path: nightly-public-api-observe-artifacts

      - name: Build calibration report
        run: |
          mapfile -t results < <(find nightly-public-api-observe-artifacts -type f -name 'result.json' | sort)
          if [[ "${#results[@]}" -eq 0 ]]; then
            echo "no result.json files found for calibration report" >&2
            exit 1
          fi
          bash ./scripts/public-api-calibration-report.sh \
            --profile standard \
            --output-dir "$RUNNER_TEMP/rivulet-nightly-calibration" \
            --inputs "${results[@]}"

      - name: Persist sampling metadata
        run: |
          metadata_dir="$RUNNER_TEMP/rivulet-nightly-sampling-metadata"
          mkdir -p "$metadata_dir"
          {
            echo "{"
            echo "  \"generated_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\","
            echo "  \"event_name\": \"${{ github.event_name }}\","
            echo "  \"sampling_label\": \"${{ github.event.inputs.sampling_label || 'schedule' }}\","
            echo "  \"sampling_slot\": \"${{ github.event.inputs.sampling_slot || 'schedule' }}\","
            echo "  \"run_id\": \"${{ github.run_id }}\","
            echo "  \"run_attempt\": \"${{ github.run_attempt }}\""
            echo "}"
          } > "$metadata_dir/sampling-metadata.json"

      - name: Build CI streak report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash ./scripts/public-api-gate-streak-report.sh \
            --repo "${{ github.repository }}" \
            --workflow ci \
            --window 40 \
            --output-dir "$RUNNER_TEMP/rivulet-nightly-streak-ci"

      - name: Build release streak report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash ./scripts/public-api-gate-streak-report.sh \
            --repo "${{ github.repository }}" \
            --workflow release \
            --window 40 \
            --output-dir "$RUNNER_TEMP/rivulet-nightly-streak-release"

      - name: Build threshold PR checklist
        run: |
          bash ./scripts/public-api-threshold-pr-checklist.sh \
            --report "$RUNNER_TEMP/rivulet-nightly-calibration/calibration-report.json" \
            --output-dir "$RUNNER_TEMP/rivulet-nightly-threshold-pr-checklist"

      - name: Build threshold change proposal
        run: |
          bash ./scripts/public-api-threshold-change-proposal.sh \
            --report "$RUNNER_TEMP/rivulet-nightly-calibration/calibration-report.json" \
            --output-dir "$RUNNER_TEMP/rivulet-nightly-threshold-change-proposal"

      - name: Build milestone-2 closure status
        run: |
          bash ./scripts/public-api-milestone2-closure-status.sh \
            --ci-streak "$RUNNER_TEMP/rivulet-nightly-streak-ci/streak-report.json" \
            --release-streak "$RUNNER_TEMP/rivulet-nightly-streak-release/streak-report.json" \
            --calibration-report "$RUNNER_TEMP/rivulet-nightly-calibration/calibration-report.json" \
            --output-dir "$RUNNER_TEMP/rivulet-nightly-milestone2-closure"

      - name: Build closure weekly report
        run: |
          bash ./scripts/public-api-closure-weekly-report.sh \
            --calibration-report "$RUNNER_TEMP/rivulet-nightly-calibration/calibration-report.json" \
            --ci-streak "$RUNNER_TEMP/rivulet-nightly-streak-ci/streak-report.json" \
            --release-streak "$RUNNER_TEMP/rivulet-nightly-streak-release/streak-report.json" \
            --closure-status "$RUNNER_TEMP/rivulet-nightly-milestone2-closure/milestone2-closure-status.json" \
            --window 10 \
            --output-dir "$RUNNER_TEMP/rivulet-nightly-closure-weekly"

      - name: Build M2 nightly review package
        run: |
          bash ./scripts/public-api-nightly-review-package.sh \
            --calibration-report "$RUNNER_TEMP/rivulet-nightly-calibration/calibration-report.json" \
            --threshold-proposal "$RUNNER_TEMP/rivulet-nightly-threshold-change-proposal/threshold-change-proposal.md" \
            --threshold-checklist "$RUNNER_TEMP/rivulet-nightly-threshold-pr-checklist/threshold-pr-checklist.md" \
            --closure-weekly "$RUNNER_TEMP/rivulet-nightly-closure-weekly/closure-weekly-report.md" \
            --closure-status "$RUNNER_TEMP/rivulet-nightly-milestone2-closure/milestone2-closure-status.json" \
            --ci-streak "$RUNNER_TEMP/rivulet-nightly-streak-ci/streak-report.json" \
            --release-streak "$RUNNER_TEMP/rivulet-nightly-streak-release/streak-report.json" \
            --output-dir "$RUNNER_TEMP/rivulet-nightly-review-package"

      - name: Build M2 cutover readiness check
        run: |
          bash ./scripts/public-api-m2-cutover-check.sh \
            --closure-status "$RUNNER_TEMP/rivulet-nightly-milestone2-closure/milestone2-closure-status.json" \
            --output-dir "$RUNNER_TEMP/rivulet-nightly-cutover-check"

      - name: Upload calibration and streak reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rivulet-nightly-public-api-calibration
          path: |
            ${{ runner.temp }}/rivulet-nightly-calibration
            ${{ runner.temp }}/rivulet-nightly-threshold-pr-checklist
            ${{ runner.temp }}/rivulet-nightly-threshold-change-proposal
            ${{ runner.temp }}/rivulet-nightly-streak-ci
            ${{ runner.temp }}/rivulet-nightly-streak-release
            ${{ runner.temp }}/rivulet-nightly-milestone2-closure
            ${{ runner.temp }}/rivulet-nightly-closure-weekly
            ${{ runner.temp }}/rivulet-nightly-review-package
            ${{ runner.temp }}/rivulet-nightly-cutover-check
            ${{ runner.temp }}/rivulet-nightly-sampling-metadata
          if-no-files-found: ignore
