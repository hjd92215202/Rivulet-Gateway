name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always
  GATEWAY_DISABLE_ACCESS_LOG: "1"
  RIVULET_RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}

jobs:
  script-standards:
    name: Release Script Standards
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check repository shell scripts
        run: bash ./scripts/check-script-standards.sh

  package-linux-x86_64:
    name: Release Linux x86_64
    runs-on: ubuntu-24.04
    needs:
      - script-standards
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve release version
        id: version
        run: echo "value=$(bash ./scripts/get-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install rpm toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm cpio

      - name: Build release binary
        run: cargo build -p gateway-main --release --target x86_64-unknown-linux-gnu

      - name: Build Linux tarball
        run: bash ./scripts/package.sh --target x86_64-unknown-linux-gnu --format tar.gz --skip-build

      - name: Smoke test installed tarball layout
        run: PORT=18084 bash ./packaging/tests/install-package.sh ./dist/x86_64-unknown-linux-gnu/rivulet-gateway-${{ steps.version.outputs.value }}.tar.gz

      - name: Build Linux rpm
        run: bash ./scripts/package.sh --target x86_64-unknown-linux-gnu --format rpm --skip-build

      - name: Smoke test installed rpm layout
        run: PORT=18085 bash ./packaging/tests/install-package.sh "$(find ./dist/rpmbuild/x86_64-unknown-linux-gnu/RPMS -name '*.rpm' | head -n 1)"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v6
        with:
          name: rivulet-linux-x86_64-release
          path: |
            dist/x86_64-unknown-linux-gnu/*.tar.gz
            dist/rpmbuild/x86_64-unknown-linux-gnu/RPMS/**/*.rpm
          if-no-files-found: error

  package-windows-x86_64:
    name: Release Windows x86_64
    runs-on: windows-2022
    needs:
      - script-standards
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve release version
        id: version
        shell: powershell
        run: |
          $value = .\scripts\get-version.ps1
          "value=$value" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Install Rust toolchain
        shell: powershell
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Build release binary
        shell: powershell
        run: cargo build -p gateway-main --release --target x86_64-pc-windows-msvc

      - name: Build Windows zip
        shell: powershell
        run: .\scripts\package.ps1 -Target x86_64-pc-windows-msvc -Format zip -SkipBuild

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v6
        with:
          name: rivulet-windows-x86_64-release
          path: dist/x86_64-pc-windows-msvc/*.zip
          if-no-files-found: error

  package-linux-arm64:
    name: Release Linux arm64
    runs-on: ubuntu-24.04-arm
    needs:
      - script-standards
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve release version
        id: version
        run: echo "value=$(bash ./scripts/get-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install rpm toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm cpio

      - name: Build release binary
        run: cargo build -p gateway-main --release --target aarch64-unknown-linux-gnu

      - name: Build Linux arm64 tarball
        run: bash ./scripts/package.sh --target aarch64-unknown-linux-gnu --format tar.gz --skip-build

      - name: Smoke test installed arm64 tarball layout
        run: PORT=18084 bash ./packaging/tests/install-package.sh ./dist/aarch64-unknown-linux-gnu/rivulet-gateway-${{ steps.version.outputs.value }}.tar.gz

      - name: Build Linux arm64 rpm
        run: bash ./scripts/package.sh --target aarch64-unknown-linux-gnu --format rpm --skip-build

      - name: Smoke test installed arm64 rpm layout
        run: PORT=18085 bash ./packaging/tests/install-package.sh "$(find ./dist/rpmbuild/aarch64-unknown-linux-gnu/RPMS -name '*.rpm' | head -n 1)"

      - name: Upload Linux arm64 artifacts
        uses: actions/upload-artifact@v6
        with:
          name: rivulet-linux-arm64-release
          path: |
            dist/aarch64-unknown-linux-gnu/*.tar.gz
            dist/rpmbuild/aarch64-unknown-linux-gnu/RPMS/**/*.rpm
          if-no-files-found: error

  systemd-lifecycle-linux-x86_64:
    name: Release Systemd Lifecycle Linux x86_64
    runs-on: ubuntu-24.04
    needs:
      - package-linux-x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download Linux x86_64 release artifacts
        uses: actions/download-artifact@v5
        with:
          name: rivulet-linux-x86_64-release
          path: release-systemd-assets/x86_64

      - name: Resolve Linux x86_64 release package artifacts
        id: artifacts
        run: |
          tarball="$(find release-systemd-assets/x86_64 -type f -name '*.tar.gz' | head -n 1)"
          rpm_package="$(find release-systemd-assets/x86_64 -type f -name '*.rpm' | head -n 1)"

          if [[ -z "$tarball" || -z "$rpm_package" ]]; then
            echo "failed to resolve tar.gz or rpm artifact" >&2
            exit 1
          fi

          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "rpm_package=$rpm_package" >> "$GITHUB_OUTPUT"

      - name: Validate systemd lifecycle (tar.gz)
        run: |
          bash ./scripts/linux-systemd-validate.sh \
            --artifact "${{ steps.artifacts.outputs.tarball }}" \
            --format tar.gz \
            --host localhost \
            --gateway-port 18384 \
            --backend-port 19384 \
            --label release-systemd-x86-tar \
            --work-dir "$RUNNER_TEMP/rivulet-release-systemd-x86-tar"

      - name: Validate systemd lifecycle (rpm)
        run: |
          bash ./scripts/linux-systemd-validate.sh \
            --artifact "${{ steps.artifacts.outputs.rpm_package }}" \
            --format rpm \
            --host localhost \
            --gateway-port 18385 \
            --backend-port 19385 \
            --label release-systemd-x86-rpm \
            --work-dir "$RUNNER_TEMP/rivulet-release-systemd-x86-rpm"

      - name: Upload Linux x86_64 systemd lifecycle reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rivulet-release-systemd-linux-x86_64
          path: |
            ${{ runner.temp }}/rivulet-release-systemd-x86-tar
            ${{ runner.temp }}/rivulet-release-systemd-x86-rpm
          if-no-files-found: ignore

  systemd-lifecycle-linux-arm64:
    name: Release Systemd Lifecycle Linux arm64
    runs-on: ubuntu-24.04-arm
    needs:
      - package-linux-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download Linux arm64 release artifacts
        uses: actions/download-artifact@v5
        with:
          name: rivulet-linux-arm64-release
          path: release-systemd-assets/arm64

      - name: Resolve Linux arm64 release package artifacts
        id: artifacts
        run: |
          tarball="$(find release-systemd-assets/arm64 -type f -name '*.tar.gz' | head -n 1)"
          rpm_package="$(find release-systemd-assets/arm64 -type f -name '*.rpm' | head -n 1)"

          if [[ -z "$tarball" || -z "$rpm_package" ]]; then
            echo "failed to resolve tar.gz or rpm artifact" >&2
            exit 1
          fi

          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "rpm_package=$rpm_package" >> "$GITHUB_OUTPUT"

      - name: Validate systemd lifecycle (tar.gz)
        run: |
          bash ./scripts/linux-systemd-validate.sh \
            --artifact "${{ steps.artifacts.outputs.tarball }}" \
            --format tar.gz \
            --host localhost \
            --gateway-port 18484 \
            --backend-port 19484 \
            --label release-systemd-arm-tar \
            --work-dir "$RUNNER_TEMP/rivulet-release-systemd-arm-tar"

      - name: Validate systemd lifecycle (rpm)
        run: |
          bash ./scripts/linux-systemd-validate.sh \
            --artifact "${{ steps.artifacts.outputs.rpm_package }}" \
            --format rpm \
            --host localhost \
            --gateway-port 18485 \
            --backend-port 19485 \
            --label release-systemd-arm-rpm \
            --work-dir "$RUNNER_TEMP/rivulet-release-systemd-arm-rpm"

      - name: Upload Linux arm64 systemd lifecycle reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rivulet-release-systemd-linux-arm64
          path: |
            ${{ runner.temp }}/rivulet-release-systemd-arm-tar
            ${{ runner.temp }}/rivulet-release-systemd-arm-rpm
          if-no-files-found: ignore

  publish:
    name: Publish GitHub Release
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    needs:
      - package-linux-x86_64
      - package-windows-x86_64
      - package-linux-arm64
      - systemd-lifecycle-linux-x86_64
      - systemd-lifecycle-linux-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download release artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-assets

      - name: Stage publish assets
        run: |
          mkdir -p publish-assets

          linux_x86_tar="$(find release-assets/rivulet-linux-x86_64-release -type f -name '*.tar.gz' | head -n 1)"
          linux_arm_tar="$(find release-assets/rivulet-linux-arm64-release -type f -name '*.tar.gz' | head -n 1)"
          windows_zip="$(find release-assets/rivulet-windows-x86_64-release -type f -name '*.zip' | head -n 1)"

          cp "$linux_x86_tar" "publish-assets/$(basename "${linux_x86_tar%.tar.gz}")-linux-x86_64.tar.gz"
          cp "$linux_arm_tar" "publish-assets/$(basename "${linux_arm_tar%.tar.gz}")-linux-arm64.tar.gz"
          cp "$windows_zip" "publish-assets/$(basename "${windows_zip%.zip}")-windows-x86_64.zip"

          find release-assets/rivulet-linux-x86_64-release -type f -name '*.rpm' -exec cp {} publish-assets/ \;
          find release-assets/rivulet-linux-arm64-release -type f -name '*.rpm' -exec cp {} publish-assets/ \;

          find publish-assets -maxdepth 1 -type f | sort

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: publish-assets
          format: spdx-json
          output-file: publish-assets/SBOM.spdx.json

      - name: Build SHA256 manifest
        run: |
          (
            cd publish-assets
            find . -maxdepth 1 -type f -printf '%P\0' | sort -z | xargs -0 sha256sum > ../SHA256SUMS.txt
          )

      - name: Verify release checksums
        run: bash ./packaging/tests/verify-checksums.sh ./SHA256SUMS.txt ./publish-assets

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: "v2.4.1"

      - name: Sign SHA256 manifest
        run: |
          cosign sign-blob \
            --yes \
            --output-signature SHA256SUMS.sig \
            --output-certificate SHA256SUMS.pem \
            SHA256SUMS.txt

      - name: Verify SHA256 manifest signature
        run: |
          cosign verify-blob \
            --certificate SHA256SUMS.pem \
            --signature SHA256SUMS.sig \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/.github/workflows/release.yml@.*$" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            SHA256SUMS.txt

      - name: Attest release provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            publish-assets/*
            SHA256SUMS.txt
            SHA256SUMS.sig
            SHA256SUMS.pem

      - name: Ensure GitHub release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "release already exists for ${GITHUB_REF_NAME}"
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes \
              --latest
          fi

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          while IFS= read -r file; do
            gh release upload "${GITHUB_REF_NAME}" --clobber "$file"
          done < <(find publish-assets -maxdepth 1 -type f | sort)

          gh release upload "${GITHUB_REF_NAME}" --clobber SHA256SUMS.txt
          gh release upload "${GITHUB_REF_NAME}" --clobber SHA256SUMS.sig
          gh release upload "${GITHUB_REF_NAME}" --clobber SHA256SUMS.pem
