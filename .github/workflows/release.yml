name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  GATEWAY_DISABLE_ACCESS_LOG: "1"

jobs:
  package-linux-x86_64:
    name: Release Linux x86_64
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve workspace version
        id: version
        run: echo "value=$(bash ./scripts/get-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install rpm toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm cpio

      - name: Build release binary
        run: cargo build -p gateway-main --release --target x86_64-unknown-linux-gnu

      - name: Build Linux tarball
        run: bash ./scripts/package.sh --target x86_64-unknown-linux-gnu --format tar.gz --skip-build

      - name: Smoke test installed tarball layout
        run: PORT=18084 bash ./packaging/tests/install-package.sh ./dist/x86_64-unknown-linux-gnu/rivulet-gateway-${{ steps.version.outputs.value }}.tar.gz

      - name: Build Linux rpm
        run: bash ./scripts/package.sh --target x86_64-unknown-linux-gnu --format rpm --skip-build

      - name: Smoke test installed rpm layout
        run: PORT=18085 bash ./packaging/tests/install-package.sh "$(find ./dist/rpmbuild/x86_64-unknown-linux-gnu/RPMS -name '*.rpm' | head -n 1)"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v6
        with:
          name: rivulet-linux-x86_64-release
          path: |
            dist/x86_64-unknown-linux-gnu/*.tar.gz
            dist/rpmbuild/x86_64-unknown-linux-gnu/RPMS/**/*.rpm
          if-no-files-found: error

  package-windows-x86_64:
    name: Release Windows x86_64
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve workspace version
        id: version
        shell: powershell
        run: |
          $value = .\scripts\get-version.ps1
          "value=$value" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Install Rust toolchain
        shell: powershell
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Build release binary
        shell: powershell
        run: cargo build -p gateway-main --release --target x86_64-pc-windows-msvc

      - name: Build Windows zip
        shell: powershell
        run: .\scripts\package.ps1 -Target x86_64-pc-windows-msvc -Format zip -SkipBuild

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v6
        with:
          name: rivulet-windows-x86_64-release
          path: dist/x86_64-pc-windows-msvc/*.zip
          if-no-files-found: error

  package-linux-arm64:
    name: Release Linux arm64
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve workspace version
        id: version
        run: echo "value=$(bash ./scripts/get-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install rpm toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm cpio

      - name: Build release binary
        run: cargo build -p gateway-main --release --target aarch64-unknown-linux-gnu

      - name: Build Linux arm64 tarball
        run: bash ./scripts/package.sh --target aarch64-unknown-linux-gnu --format tar.gz --skip-build

      - name: Smoke test installed arm64 tarball layout
        run: PORT=18084 bash ./packaging/tests/install-package.sh ./dist/aarch64-unknown-linux-gnu/rivulet-gateway-${{ steps.version.outputs.value }}.tar.gz

      - name: Build Linux arm64 rpm
        run: bash ./scripts/package.sh --target aarch64-unknown-linux-gnu --format rpm --skip-build

      - name: Smoke test installed arm64 rpm layout
        run: PORT=18085 bash ./packaging/tests/install-package.sh "$(find ./dist/rpmbuild/aarch64-unknown-linux-gnu/RPMS -name '*.rpm' | head -n 1)"

      - name: Upload Linux arm64 artifacts
        uses: actions/upload-artifact@v6
        with:
          name: rivulet-linux-arm64-release
          path: |
            dist/aarch64-unknown-linux-gnu/*.tar.gz
            dist/rpmbuild/aarch64-unknown-linux-gnu/RPMS/**/*.rpm
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    needs:
      - package-linux-x86_64
      - package-windows-x86_64
      - package-linux-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download release artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-assets

      - name: Build SHA256 manifest
        run: |
          find release-assets -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt

      - name: Verify release checksums
        run: bash ./packaging/tests/verify-checksums.sh ./SHA256SUMS.txt .

      - name: Ensure GitHub release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "release already exists for ${GITHUB_REF_NAME}"
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes \
              --latest
          fi

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -t files < <(find release-assets -type f | sort)
          gh release upload "${GITHUB_REF_NAME}" \
            --clobber \
            "${files[@]}" \
            SHA256SUMS.txt
