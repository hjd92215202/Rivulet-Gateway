[runtime]
worker_threads = 4
graceful_shutdown_secs = 30

[[listeners]]
name = "public-http"
address = "0.0.0.0:8080"
protocol = "http1"

[[upstreams]]
name = "api-cluster"
load_balance = "round_robin"

[[upstreams.endpoints]]
address = "10.0.0.10:9000"
weight = 1

[[upstreams.endpoints]]
address = "10.0.0.11:9000"
weight = 1

[[routes]]
name = "api-v1"
listener = "public-http"
hosts = ["api.example.com"]
path_prefixes = ["/v1/"]
methods = ["GET", "POST"]
upstream = "api-cluster"
filters = ["request-id", "access-log"]
