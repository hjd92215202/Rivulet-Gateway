[runtime]
worker_threads = 4
graceful_shutdown_secs = 30
downstream_read_timeout_ms = 5000
upstream_connect_timeout_ms = 3000
upstream_read_timeout_ms = 5000
upstream_retry_attempts = 2
upstream_idle_pool_size = 1
max_upstream_status_line_bytes = 8192
max_upstream_headers = 100
max_upstream_header_bytes = 65536
max_upstream_body_bytes = 8388608
max_request_line_bytes = 8192
max_request_headers = 100
max_request_body_bytes = 1048576

[[listeners]]
name = "public-http"
address = "0.0.0.0:8080"
protocol = "http1"

[[upstreams]]
name = "api-cluster"
load_balance = "round_robin"

[upstreams.policy]
connect_timeout_ms = 1500
read_timeout_ms = 4000
retry_attempts = 2

[upstreams.health_check]
interval_ms = 3000
timeout_ms = 1000
healthy_threshold = 2
unhealthy_threshold = 2

[[upstreams.endpoints]]
address = "10.0.0.10:9000"
weight = 1

[[upstreams.endpoints]]
address = "10.0.0.11:9000"
weight = 1

[[routes]]
name = "api-v1"
listener = "public-http"
hosts = ["api.example.com"]
path_prefixes = ["/v1/"]
methods = ["GET", "POST"]
upstream = "api-cluster"
filters = ["request-id", "access-log"]

[routes.policy]
read_timeout_ms = 2500

[routes.auth]
bearer_tokens = ["dev-gateway-token"]
query_tokens = ["dev-share-token"]
query_token_name = "share_token"

[routes.rate_limit]
requests = 120
window_ms = 1000
key = "client_ip"
